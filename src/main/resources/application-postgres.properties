# Run with: SPRING_PROFILES_ACTIVE=postgres (start the database with `docker compose up -d` first)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/workorders}
spring.datasource.username=${DB_USERNAME:workorders}
spring.datasource.password=${DB_PASSWORD:workorders}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
