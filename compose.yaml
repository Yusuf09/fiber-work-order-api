services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: workorders
      POSTGRES_USER: workorders
      POSTGRES_PASSWORD: workorders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workorders"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/workorders
    ports:
      - "8080:8080"
